<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <link rel="stylesheet" href="color1.css">
    <script src="color1.js" defer></script>
</head>
<body>
    <section id="present_color">
        <h1>Color Flippper <span id="color_code" ># ffffff</span></h1>
        <div class="button_wrapper">
            <div class="button_group">
                <button style="background-color: red;">Red</button>
                <button style="background-color: yellow;">Yellow</button>
                <button style="background-color: green;">Green</button>
            </div>
            <button id="new_color">New color!</button>
        </div>
    </section>
    
</body>
</html>
